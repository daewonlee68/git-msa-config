server:
  port: 8080

spring:
  application:
    name: market-service
  main:
    allow-bean-definition-overriding: true
  config:
    activate:
      on-profile: prod
  servlet:
    multipart:
      max-file-size: 2MB      # 10MB → 2MB
      max-request-size: 2MB
  cloud:
    discovery:
      enabled: false
    loadbalancer:
      enabled: false
  redis:
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 2
    port: 6379
    host: redis.backend.svc.cluster.local
    password: opredis@^1234!
    timeout: 3000ms
  thymeleaf:
    check-template-location: false
  security:
    user:
      name: ${ACTUATOR_USER}  # Kubernetes Secret 필수
      password: ${ACTUATOR_PASSWORD}  # Kubernetes Secret 필수

jdbc:
  url: jdbc:log4jdbc:postgresql://postgresql-external-prod.backend.svc.cluster.local:5432/tiremsdb?prepareThreshold=1
  username: admin_user
  password: admin@^1234!
  driverClassName: net.sf.log4jdbc.sql.jdbcapi.DriverSpy

management:
  endpoint:
    health:
      show-details: when-authorized  # 인증 필요

