cloud:
  aws:
    s3:
      endpoint: ${S3_ENDPOINT:}
      bucket: ${S3_BUCKET:uploads}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
cdn:
  base-url: ${CDN_BASE_URL:}

file:
  upload:
    path: /app/uploads

minio:
  endpoint: http://minio-external.minio.svc.cluster.local:9000
  access-key: ${MINIO_BIZ_DOCS_ACCESS_KEY}
  secret-key: ${MINIO_BIZ_DOCS_SECRET_KEY}
  bucket: business-docs

eureka:
  client:
    register-with-eureka: false  # 자신을 Eureka에 등록하지 않음
    fetch-registry: false