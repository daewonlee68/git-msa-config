server:
  port: 8080

spring:
  application:
    name: tire-mg-service
  main:
    allow-bean-definition-overriding: true
  profiles:
    active:
      on-profile: dev
  cloud:
    discovery:
      enabled: false
    loadbalancer:
      enabled: false
  redis:
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 2
    port: 6379
    host: redis.backend.svc.cluster.local
    password: authadmin202607!
    timeout: 3000ms
  thymeleaf:
    check-template-location: false
  security:
    user:
      name: ${ACTUATOR_USER}  # Kubernetes Secret 필수
      password: ${ACTUATOR_PASSWORD}  # Kubernetes Secret 필수

jdbc:
  url: jdbc:log4jdbc:postgresql://postgresql-external.backend.svc.cluster.local:5432/tiremsdb?prepareThreshold=1
  username: admin_user
  password: admin@^1234!
  driverClassName: net.sf.log4jdbc.sql.jdbcapi.DriverSpy

notify:
  server:
    base-url: http://notify-service.backend.svc.cluster.local:8080
    send-path: /notify-service/api/v1/alarm/notify/send

firebase:
  enabled: true
  project-id: tibiseo-eb3d2
  credentials:
    base64: 

cloud:
  aws:
    s3:
      endpoint: ${S3_ENDPOINT:}
      bucket: ${S3_BUCKET:uploads}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
cdn:
  base-url: ${CDN_BASE_URL:}

file:
  upload:
    path: /app/uploads

molit:
  vehicle:
    api:
      url: https://linkstg.car365.go.kr/hub/kotsa
      service-id: AC1_ZA85_01
      cvmis-apikey: 7AA75EC3-917067ED-689C6D47-96345CA9
      private-key-password: test1234!
      public-key-base64: 
      private-key-base64: 
      log-response: false

management:
  endpoint:
    health:
      show-details: when-authorized  # 인증 필요

eureka:
  client:
    register-with-eureka: false  # 자신을 Eureka에 등록하지 않음
    fetch-registry: false
